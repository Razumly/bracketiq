name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect mobile paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'apps/site/src/app/api/**'
              - 'apps/site/prisma/schema.prisma'
              - '.github/workflows/mobile-ci.yml'
              - 'AGENTS.md'
              - 'CONTEXT.md'
              - 'PLANS.md'

  android-tests:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace --profile

      - name: Upload Android test results and build profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-results
          path: |
            apps/mobile/**/build/reports/tests/
            apps/mobile/**/build/test-results/
            apps/mobile/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  android-release:
    name: Android release validation
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Verify release Google Sign-In resource
        run: ./scripts/tests/google-sign-in-release-resource-contract.sh --profile

      - name: Verify Android release API endpoint
        run: ./scripts/tests/android-release-api-base-url-contract.sh --profile

      - name: Upload release build profiles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-release-profiles
          path: apps/mobile/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  ios-tests:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Identify native toolchain
        id: native-toolchain
        run: echo "xcode=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore native compiler and CocoaPods state
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            apps/mobile/composeApp/build/cocoapods
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.xcode }}-${{ hashFiles('apps/mobile/gradle/libs.versions.toml', 'apps/mobile/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/gradle.properties', 'apps/mobile/composeApp/build.gradle.kts', 'apps/mobile/iosApp/Podfile', 'apps/mobile/iosApp/Podfile.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-toolchain.outputs.xcode }}-${{ hashFiles('apps/mobile/gradle/libs.versions.toml', 'apps/mobile/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/gradle.properties', 'apps/mobile/composeApp/build.gradle.kts', 'apps/mobile/iosApp/Podfile', 'apps/mobile/iosApp/Podfile.lock') }}-

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Verify iOS release API endpoint
        run: ./scripts/tests/ios-release-api-base-url-contract.sh

      - name: Select and boot an iOS simulator
        shell: bash
        run: |
          simulator_udid="$(
            xcrun simctl list devices available |
              sed -nE '/iPhone/ {
                s/.*\(([0-9A-Fa-f-]{36})\).*/\1/p
                q
              }'
          )"
          if [[ -z "$simulator_udid" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Run iOS simulator tests
        run: >-
          ./gradlew
          :composeApp:iosSimulatorArm64Test
          :core:database:iosSimulatorArm64Test
          -PiosDevice="$IOS_SIMULATOR_UDID"
          --continue
          --stacktrace
          --profile

      - name: Upload iOS test results and build profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-results
          path: |
            apps/mobile/**/build/reports/tests/
            apps/mobile/**/build/test-results/
            apps/mobile/build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Mobile CI gate
    needs:
      - changes
      - android-tests
      - android-release
      - ios-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate mobile CI
        env:
          MOBILE_CHANGED: ${{ needs.changes.outputs.mobile }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android-tests.result }}
          ANDROID_RELEASE_RESULT: ${{ needs.android-release.result }}
          IOS_RESULT: ${{ needs.ios-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Mobile path detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$MOBILE_CHANGED" == "true" && "$ANDROID_RESULT" != "success" ]]; then
            echo "Android unit tests did not pass: $ANDROID_RESULT" >&2
            exit 1
          fi
          if [[ "$MOBILE_CHANGED" == "true" && "$ANDROID_RELEASE_RESULT" != "success" ]]; then
            echo "Android release validation did not pass: $ANDROID_RELEASE_RESULT" >&2
            exit 1
          fi
          if [[ "$MOBILE_CHANGED" == "true" && "$IOS_RESULT" != "success" ]]; then
            echo "iOS simulator tests did not pass: $IOS_RESULT" >&2
            exit 1
          fi
          echo "Mobile CI gate passed. Mobile changed: $MOBILE_CHANGED."
