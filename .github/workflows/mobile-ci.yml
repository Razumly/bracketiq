name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect mobile changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect mobile paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'apps/site/src/app/api/**'
              - 'apps/site/prisma/schema.prisma'
              - '.github/workflows/mobile-ci.yml'
              - 'AGENTS.md'
              - 'CONTEXT.md'
              - 'PLANS.md'
            contract:
              - 'apps/mobile/core/network/**'
              - 'apps/mobile/core/repository-impl/**'
              - 'apps/mobile/composeApp/src/androidUnitTest/kotlin/com/razumly/mvp/testing/**'
              - 'apps/mobile/composeApp/src/androidUnitTest/kotlin/com/razumly/mvp/eventDetail/**'
              - 'apps/site/src/contracts/**'
              - 'apps/site/src/app/api/**'
              - 'apps/site/src/server/**'
              - 'apps/site/prisma/**'
              - 'apps/site/package.json'
              - 'apps/site/package-lock.json'

  android-tests:
    name: Android unit tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Verify release Google Sign-In resource
        run: ./scripts/tests/google-sign-in-release-resource-contract.sh

      - name: Verify Android release API endpoint
        run: ./scripts/tests/android-release-api-base-url-contract.sh

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

  mobile-api-contract:
    name: Mobile to site API integration
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bracketiq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bracketiq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/site
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bracketiq_ci
      AUTH_SECRET: bracketiq-mobile-api-ci-secret
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      REDIS_DISABLED: "true"
      MVP_TEST_BACKEND_URL: http://127.0.0.1:3000
      MVP_TEST_ALLOW_DB_SEED: "1"
      TZ: America/Los_Angeles
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run migrate:deploy

      - name: Seed integration fixtures
        run: npm run seed:dev

      - name: Start site backend
        run: |
          npm run dev:plain -- --port 3000 > "$RUNNER_TEMP/bracketiq-site.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bracketiq-site.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/bracketiq-site.log"
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*

      - name: Install Android SDK packages
        working-directory: apps/mobile
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Run mobile Event Editor API contract test
        working-directory: apps/mobile
        run: >-
          ./gradlew
          :composeApp:testDebugUnitTest
          --tests
          com.razumly.mvp.eventDetail.EventLifecycleMobileApiIntegrationTest.given_mobile_editor_create_command_when_sent_to_site_then_event_is_persisted
          --stacktrace

      - name: Stop site backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bracketiq-site.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/bracketiq-site.pid")" || true
          fi


  ios-tests:
    name: iOS simulator tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: apps/mobile/**/*.gradle*

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Verify iOS release API endpoint
        run: ./scripts/tests/ios-release-api-base-url-contract.sh

      - name: Select and boot an iOS simulator
        shell: bash
        run: |
          simulator_udid="$(
            xcrun simctl list devices available |
              sed -nE '/iPhone/ {
                s/.*\(([0-9A-Fa-f-]{36})\).*/\1/p
                q
              }'
          )"
          if [[ -z "$simulator_udid" ]]; then
            echo "No available iPhone simulator was found." >&2
            exit 1
          fi
          echo "IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Run iOS simulator tests
        run: >-
          ./gradlew
          :composeApp:iosSimulatorArm64Test
          :core:database:iosSimulatorArm64Test
          -PiosDevice="$IOS_SIMULATOR_UDID"
          --continue
          --stacktrace

  gate:
    name: Mobile CI gate
    needs:
      - changes
      - android-tests
      - mobile-api-contract
      - ios-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate mobile CI
        env:
          MOBILE_CHANGED: ${{ needs.changes.outputs.mobile }}
          CONTRACT_CHANGED: ${{ needs.changes.outputs.contract }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android-tests.result }}
          CONTRACT_RESULT: ${{ needs.mobile-api-contract.result }}
          IOS_RESULT: ${{ needs.ios-tests.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Mobile path detection failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$MOBILE_CHANGED" == "true" && "$ANDROID_RESULT" != "success" ]]; then
            echo "Android unit tests did not pass: $ANDROID_RESULT" >&2
            exit 1
          fi
          if [[ "$MOBILE_CHANGED" == "true" && "$IOS_RESULT" != "success" ]]; then
            echo "iOS simulator tests did not pass: $IOS_RESULT" >&2
            exit 1
          fi
          if [[ "$CONTRACT_CHANGED" == "true" && "$CONTRACT_RESULT" != "success" ]]; then
            echo "Mobile to site API integration did not pass: $CONTRACT_RESULT" >&2
            exit 1
          fi
          echo "Mobile CI gate passed. Mobile changed: $MOBILE_CHANGED."
